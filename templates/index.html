<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meme Humor Analyzer</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center">Meme Humor Analyzer</h2>
        <p class="text-center">Upload a meme and let AI explain why it's funny!</p>

        <div class="card shadow-sm p-4">
            <form id="memeForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="meme" class="form-label">Upload Meme:</label>
                    <input type="file" id="meme" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Analyze Meme</button>
            </form>
        </div>

        <div class="mt-4 text-center">
            <h4>Uploaded Meme:</h4>
            <img id="memeImage" class="img-fluid d-none" alt="Uploaded Meme">
            <h4 class="mt-3">Humor Explanation:</h4>
            <p id="memeExplanation" class="alert alert-info d-none"></p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById("memeForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("meme", document.getElementById("meme").files[0]);

            document.getElementById("memeExplanation").classList.add("d-none");
            document.getElementById("memeExplanation").textContent = "Analyzing meme...";

            const response = await fetch("/analyze_meme", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.explanation) {
                document.getElementById("memeImage").src = data.image_url;
                document.getElementById("memeImage").classList.remove("d-none");
                document.getElementById("memeExplanation").textContent = data.explanation;
                document.getElementById("memeExplanation").classList.remove("d-none");
            } else {
                document.getElementById("memeExplanation").textContent = "Error analyzing meme.";
            }
        });
    </script>
</body>
</html>
